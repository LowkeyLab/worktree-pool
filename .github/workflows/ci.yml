name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rust:
    name: Rust (${{ matrix.toolchain }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        toolchain: [minimum, stable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Select toolchain
        env:
          SELECTED_TOOLCHAIN: ${{ matrix.toolchain }}
        run: |
          toolchain="$SELECTED_TOOLCHAIN"
          if [ "$toolchain" = minimum ]; then
            toolchain=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["rust-version"])')
          fi
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy
          echo "RUSTUP_TOOLCHAIN=$toolchain" >> "$GITHUB_ENV"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked --release
      - run: python3 -m unittest discover -s benchmark -p '*_test.py'
  installation:
    name: Package and Git 2.36 acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install minimum Rust
        run: |
          toolchain=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["rust-version"])')
          rustup toolchain install "$toolchain" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$toolchain" >> "$GITHUB_ENV"
      - run: python3 install/verify.py --output "$RUNNER_TEMP/installation-acceptance"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: installation-evidence
          path: |
            ${{ runner.temp }}/installation-acceptance/*.json
            ${{ runner.temp }}/installation-acceptance/*.jsonl
            ${{ runner.temp }}/installation-acceptance/*.log
            ${{ runner.temp }}/installation-acceptance/toolchain.txt
          if-no-files-found: warn
  ci:
    name: CI passed
    if: always()
    needs: [rust, installation]
    runs-on: ubuntu-24.04
    steps:
      - name: Require all jobs
        env:
          RUST_RESULT: ${{ needs.rust.result }}
          INSTALL_RESULT: ${{ needs.installation.result }}
        run: test "$RUST_RESULT" = success && test "$INSTALL_RESULT" = success
