[package]
name = "worktree-pool"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "Explicit ownership for persistent local Git worktrees"
license = "AGPL-3.0-only"
repository = "https://github.com/LowkeyLab/worktree-pool"
readme = "README.md"
# Package the public sources and test helper; repository automation stays outside the crate.
include = ["/*.rs", "/Cargo.lock", "/LICENSE", "/README.md", "/CONTRIBUTING.md", "/WIRE_SCHEMA.md", "/DEPENDENCIES.md", "/test_support/*.rs"]

[lib]
path = "lib.rs"

[[bin]]
name = "worktree-pool"
path = "main.rs"

[[test]]
name = "cli"
path = "cli_test.rs"

[[example]]
name = "crash_helper"
path = "test_support/main.rs"

[dependencies]
anyhow = "=1.0.104"
chrono = { version = "=0.4.45", features = ["serde"] }
clap = { version = "=4.6.7", features = ["derive"] }
cloudevents-sdk = { version = "=0.9.0", default-features = false }
config = { version = "=0.15.27", default-features = false, features = ["toml"] }
redb = "=4.4.0"
serde = { version = "=1.0.229", features = ["derive"] }
sha2 = { version = "=0.11.1", default-features = false }
serde_json = "=1.0.154"
thiserror = "=2.0.21"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["json"] }
uuid = { version = "=1.28.0", features = ["v4", "serde"] }

[dev-dependencies]
googletest = "=0.14.3"
insta = { version = "=1.49.0", features = ["yaml"] }
tempfile = "=3.27.0"
proptest = { version = "=1.12.0", default-features = false, features = ["std"] }
